name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_model:
        description: "Also run a full tuning with real models on Linux and macOS (provider/model, comma-separated). Empty = skip."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.9"}  # the newest Ubuntu image has no Python 3.9 any more
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.9"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  opencode:
    name: real OpenCode lists the agents (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g opencode-ai
      - run: opencode --version
      - run: python lineup.py install
      - run: python lineup.py status
      - name: OpenCode lists all six agents
        shell: bash
        run: |
          opencode agent list > agents.txt 2>&1 || true
          grep "lineup-" agents.txt || true
          for role in briefing docs files numbers office writer; do
            grep -q "lineup-$role" agents.txt || { echo "missing: lineup-$role"; cat agents.txt; exit 1; }
          done
      - run: python lineup.py uninstall

  live:
    name: real models, a full tuning run (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.live_model != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g opencode-ai
      - run: opencode --version
      - run: python lineup.py install
      - name: Tune
        shell: bash
        run: |
          set -o pipefail
          python lineup.py tune --models "${{ inputs.live_model }}" --hard --timeout 240 2>&1 | tee tune.log
      - name: Continue once if a usage limit stopped the run
        shell: bash
        run: |
          set -o pipefail
          stopped=$(python -c "import json, pathlib; print(json.loads((pathlib.Path.home() / '.lineup' / 'lineup.json').read_text(encoding='utf-8'))['stopped'])")
          if [ -n "$stopped" ]; then
            echo "Stopped: $stopped"
            sleep 120
            python lineup.py tune --models "${{ inputs.live_model }}" --hard --resume --timeout 240 2>&1 | tee -a tune.log
          fi
      - run: python lineup.py status
      - name: The run is complete
        shell: bash
        run: |
          python - <<'EOF'
          import json, pathlib
          result = json.loads((pathlib.Path.home() / ".lineup" / "lineup.json").read_text(encoding="utf-8"))
          print(json.dumps(result["table"], indent=1))
          cells = [cell for by_model in result["table"].values() for cell in by_model.values()]
          asked = sum(cell["runs"] for cell in cells)
          unanswered = sum(cell["errors"] for cell in cells)
          print(f"{asked} questions, {unanswered} without an answer, {len(result['refused'])} of those refused by the provider")
          for item in result["refused"]:
              print("refused:", item)
          assert not result["stopped"], result["stopped"]
          assert not result["left_out"], result["left_out"]
          assert len(result["measured"]) == 6, result["measured"]
          assert result["applied"], "the lineup was not applied"
          assert unanswered == len(result["refused"]), "a question got no answer for another reason than a refusal"
          EOF
      - name: Why a question got no answer
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys
          sys.path.insert(0, ".")
          import lineup
          home = pathlib.Path.home() / ".lineup"
          model = "${{ inputs.live_model }}".split(",")[0]
          rows = [json.loads(line) for line in (home / "results.jsonl").read_text(encoding="utf-8").splitlines()]
          answered = {row["task"] for row in rows if row["model"] == model and not row["error"]}
          missing = [(role, task) for role, tasks in lineup.load_tasks(True).items() for task in tasks if task["id"] not in answered]
          print("not answered by", model, ":", [task["id"] for _, task in missing])
          for role, task in missing[:1]:
              executable = lineup.find_opencode(None)
              command = [executable, "run", *lineup.run_flags(executable), "--print-logs", "--agent", lineup.PREFIX + role,
                         "--format", "json", "--model", model, task["prompt"]]
              try:
                  done = subprocess.run(command, cwd=lineup.FIXTURES, stdin=subprocess.DEVNULL, capture_output=True, timeout=90)
                  output, errors = done.stdout, done.stderr
              except subprocess.TimeoutExpired as stopped:
                  output, errors = stopped.stdout or b"", stopped.stderr or b""
              for line in output.decode("utf-8", "replace").splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  part = event.get("part", {})
                  print("event:", event.get("type"), part.get("type", ""), part.get("tool", ""),
                        json.dumps(part.get("state", {}).get("input", ""))[:200], str(part.get("text", ""))[:200])
              for line in errors.decode("utf-8", "replace").splitlines():
                  if any(word in line.lower() for word in ("error", "limit", "retry", "status", "webfetch")):
                      print("log:", line[:400])
          EOF
      - name: Collect the files of the run
        if: always()
        shell: bash
        run: |
          mkdir -p run-files
          cp ~/.lineup/report.html ~/.lineup/lineup.json ~/.lineup/results.jsonl tune.log run-files/ || true
          opencode --version > run-files/opencode-version.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tuning-run-${{ matrix.os }}
          path: run-files
