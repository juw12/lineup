name: release

# A tag v1.2.3 builds lineup.exe for Windows, tries it, and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - run: python -m pip install pyinstaller
      - name: Build lineup.exe
        run: >
          pyinstaller --onefile --console --name lineup
          --add-data "agents;agents" --add-data "fixtures;fixtures"
          --add-data "tasks.json;." --add-data "report_template.html;."
          lineup.py
      - name: Try the exe
        shell: pwsh
        run: |
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "opencode"
          $env:LINEUP_HOME = Join-Path $env:RUNNER_TEMP "lineup-home"
          $version = (& dist\lineup.exe --version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") { throw "the exe says $version, the tag is ${{ github.ref_name }}" }
          & dist\lineup.exe install
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          $agents = @(Get-ChildItem (Join-Path $env:OPENCODE_CONFIG_DIR "agents") -Filter "lineup-*.md")
          if ($agents.Count -ne 6) { throw "expected 6 agent files, found $($agents.Count)" }
          & dist\lineup.exe status
          if ($LASTEXITCODE -ne 0) { throw "status failed" }
          & dist\lineup.exe uninstall
          (Get-FileHash dist\lineup.exe -Algorithm SHA256).Hash.ToLower() + "  lineup.exe" | Set-Content dist\lineup.exe.sha256 -Encoding ascii
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $text = Get-Content CHANGELOG.md -Raw
          $match = [regex]::Match($text, "(?ms)^## $([regex]::Escape($version))[^\n]*\n(.*?)(?=^## |\z)")
          if (-not $match.Success) { throw "CHANGELOG.md has no section for $version" }
          $match.Groups[1].Value.Trim() | Set-Content notes.md -Encoding utf8
          Get-Content notes.md
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/lineup.exe dist/lineup.exe.sha256 --title "Lineup ${{ github.ref_name }}" --notes-file notes.md
